plugins {
    id 'com.android.application'
}

android {
    namespace 'com.babelmic.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.babelmic.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // AndroidX core
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.fragment:fragment:1.6.2'

    // RecyclerView for device list
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // ML Kit On-Device Translation (no internet required after model download)
    implementation 'com.google.mlkit:translate:17.0.2'

    // ML Kit Language Identification (auto-detect spoken language)
    implementation 'com.google.mlkit:language-id:17.0.4'

    // Lifecycle (ViewModel + LiveData for reactive UI updates)
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'

    // Executor service helper
    implementation 'androidx.concurrent:concurrent-futures:1.1.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
